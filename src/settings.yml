---
# TRMNL private plugin definition. Uploaded and downloaded by `trmnlp push` /
# `trmnlp pull`, and read by the ZIP importer built by tools/build_plugin.py.
#
# `trmnlp push` needs an `id:` here to update an existing plugin rather than
# create a new one each run. Run `trmnlp clone <name> <id>` or `trmnlp pull`
# once against the real plugin and the id is filled in for you.
# id: 12345

name: Rivian

# Home Assistant pushes to TRMNL, so HA never needs to be exposed to the
# internet and no long-lived HA token leaves your network.
strategy: webhook

# Minutes, and one of TRMNL's accepted values (15 | 60 | 360 | 720 | 1440).
#
# Worth knowing what this does NOT do: TRMNL deduplicates at the data layer, so
# a payload identical to the last one is dropped before the render step. The
# screen is not re-rendered on this interval "just because" — it is re-rendered
# when new, different content arrives. That is why the Home Assistant package
# sends a bucketed `link_age_min`: it is what makes a dead feed produce a
# genuinely different payload, and therefore a screen that can say so.
refresh_interval: 15

no_screen_padding: 'no'
dark_mode: 'no'

# Pinned so a framework release can't silently reflow the layout — every view
# in this repo was verified against 3.1. Bump deliberately, then re-run
# `npm run preview:all` and check all four sizes. Use `latest` to track the
# newest release instead. Current versions: https://trmnl.com/framework/releases
framework_version: '3.1'

custom_fields:
  # TRMNL's publishing guidance asks webhook plugins to state their setup
  # requirements up front, so the two hard prerequisites stay here — the worst
  # version of this plugin is the one someone installs before discovering it
  # needs a paid add-on. Everything else lives in the README, which is the right
  # place for it and the only place that can be kept current.
  #
  # No contact address by design: the repository's issue tracker is the support
  # channel, so there is one public route and no personal inbox behind it.
  #
  # NOTE before publishing: add `category:` with up to two values chosen from
  # TRMNL's own category list in the publish UI. It is deliberately not guessed
  # here — a wrong value fails the CHEF linter. If the linter turns out to
  # require a contact email as well, use a project alias or the issue tracker
  # URL; do not put a personal address here.
  - keyname: about
    name: About This Plugin
    field_type: author_bio
    description: >-
      Shows your Rivian on a TRMNL: state of charge, range, cabin temperature,
      what is still open, and a health row. Data comes from Home Assistant, so
      nothing but your own hardware ever talks to Rivian.<br/><br/>
      <b>Needs setup before it will show anything:</b> Home Assistant with the
      community Rivian integration, plus TRMNL's Developer add-on (one-time $20,
      per device) which private plugins require.<br/><br/>
      Setup guide, troubleshooting and current upstream caveats are in the
      GitHub repo. Bug reports and contributions are welcome there.
    github_url: https://github.com/rancur/trmnl-rivian
    learn_more_url: https://github.com/rancur/trmnl-rivian#setup

  - keyname: vehicle_label
    name: Vehicle Label
    field_type: string
    optional: true
    description: >-
      Shown in the title bar. Leave blank to use the name you gave the vehicle
      in the Rivian app, which Home Assistant sends in the payload.

  - keyname: logo_url
    name: Logo URL
    field_type: url
    optional: true
    description: >-
      Replaces the title bar mark with an image of your choosing. Must be a URL
      TRMNL's renderer can reach. Leave blank to use the built-in mark.
